name: Docker images

# Every push and pull request builds both service images, so a broken Dockerfile fails here and not on release.
# A release tag v* also pushes them to GHCR for linux/amd64 and linux/arm64, tagged with the version and latest -
# the images docker/compose.servlet.yml pulls.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [ order-service, notification-service ]
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: env.RELEASE == 'true'

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.RELEASE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          # v0.1.0 -> 0.1.0 and latest; branches and pull requests get no tags, they are never pushed
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ env.RELEASE }}
          labels: |
            org.opencontainers.image.title=${{ matrix.service }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: ${{ env.RELEASE == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.RELEASE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
