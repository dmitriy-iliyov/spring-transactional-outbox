spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notifications}
    username: ${DB_USER:notifications}
    password: ${DB_PASSWORD:notifications}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 2000
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:notification-service}
      auto-offset-reset: earliest
      # offsets are committed by the listener container after an event is processed
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # publishes failed records to the dead letter topic as they were read
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    listener:
      # every consumed record is handled in a span of its own, so its log lines carry a trace and span id
      observation-enabled: true

app:
  kafka:
    order-events-topic: ${ORDER_EVENTS_TOPIC:order-events}
    retries: 3
    retry-interval: 1s
    transient-retry:
      initial-interval: 1s
      max-interval: 30s
    health-timeout: 3s

oncebox:
  # inbox cleanup only
  thread-pool-size: 1
  outbox:
    enabled: false
  inbox:
    enabled: true
    source:
      type: kafka
    mappings:
      order-created: io.github.outbox.contract.OrderCreatedEvent
      order-cancelled: io.github.outbox.contract.OrderCancelledEvent
    clean-up:
      # oncebox schedules the inbox cleanup only when this is set explicitly; its default does not reach the condition
      enabled: true
      # longer than any redelivery window, so a late duplicate still finds its id
      ttl: 7d
      polling:
        initial-delay: 1m
    metrics:
      enabled: true

springdoc:
  api-docs:
    # OpenAPI 3.0, as in the order service: 3.1 drops the nullable flag of fields
    version: openapi_3_0
  default-produces-media-type: application/json

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  metrics:
    tags:
      application: ${spring.application.name}
  # Spans are exported over OTLP once MANAGEMENT_OTLP_TRACING_ENDPOINT points at a collector; without it the trace
  # and span ids still reach the logs
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
      group:
        # Kafka is reported, but not part of readiness: readiness decides whether the notifications API gets HTTP
        # traffic, and that API reads the database only; consuming goes on or waits regardless
        readiness:
          include: readinessState,db
